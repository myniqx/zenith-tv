[package]
name = "zenith-parser"
version = "0.1.0"
edition = "2021"
authors = ["myniqx"]
description = "High-performance M3U parser for Zenith TV"
license = "MIT"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# WASM bindings — only for wasm32 target (desktop / Tizen)
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
js-sys = { version = "0.3", optional = true }

# Regex for episode detection
regex = "1.10"
lazy_static = "1.4"

# Optional: For better performance
memchr = "2.7"

[features]
default = []
wasm = ["wasm-bindgen", "serde-wasm-bindgen", "js-sys"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
